services:
  - type: web
    name: College-GPT
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import app; from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(['warmup'])"
    startCommand: gunicorn -c gunicorn.conf.py --timeout 300 --workers 1 --threads 1 app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
