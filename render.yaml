services:
  - type: web
    name: College-GPT
    env: python
    buildCommand: pip install -r requirements.txt && python -c "import chromadb.utils.embedding_functions as ef; ef.DefaultEmbeddingFunction()(['warmup'])"
    startCommand: gunicorn -c gunicorn.conf.py app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: PYTHONUNBUFFERED
        value: "1"
